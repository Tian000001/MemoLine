<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能复盘 · 时间线复盘</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="min-h-screen bg-slate-900 text-slate-100">
    <div id="app-header"></div>

    <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-8">
      <div class="space-y-6">
        <!-- 页头 -->
        <div>
          <h2 class="text-2xl font-semibold tracking-tight text-slate-100">智能复盘分析</h2>
          <p class="mt-1 text-sm text-slate-400">
            选择时间范围或指定事件，AI 将自动生成结构化复盘报告
          </p>
        </div>

        <!-- 创建分析报告 -->
        <div class="rounded-xl border border-slate-700/50 bg-slate-800/60 p-5 backdrop-blur-sm">
          <h3 class="mb-4 flex items-center gap-2 text-base font-medium text-slate-200">
            <i data-lucide="sparkles" class="h-4 w-4 text-cyan-400"></i>
            创建分析报告
          </h3>

          <div class="grid gap-4 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="mb-1.5 block text-sm text-slate-400" for="f-title">报告标题</label>
              <input
                id="f-title"
                type="text"
                placeholder="输入报告标题"
                class="w-full rounded-lg border border-slate-700/50 bg-slate-900/60 px-3 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:border-cyan-500/50 focus:outline-none"
              />
            </div>
            <div class="sm:col-span-2">
              <label class="mb-1.5 block text-sm text-slate-400">时间范围</label>
              <div class="flex items-end gap-2">
                <input
                  id="f-start"
                  type="date"
                  class="flex-1 rounded-lg border border-slate-700/50 bg-slate-900/60 px-3 py-2 text-sm text-slate-200 focus:border-cyan-500/50 focus:outline-none"
                />
                <span class="pb-2 text-slate-500">至</span>
                <input
                  id="f-end"
                  type="date"
                  class="flex-1 rounded-lg border border-slate-700/50 bg-slate-900/60 px-3 py-2 text-sm text-slate-200 focus:border-cyan-500/50 focus:outline-none"
                />
              </div>
            </div>
          </div>

          <!-- 事件选择器 -->
          <div class="mt-4">
            <button
              id="btn-toggle-picker"
              type="button"
              class="flex items-center gap-2 text-sm text-cyan-400 transition-colors hover:text-cyan-300"
            >
              <i data-lucide="list-checks" class="h-3.5 w-3.5"></i>
              指定事件（可选）
              <span
                id="picker-count"
                class="rounded-full bg-cyan-500/10 px-2 py-0.5 text-xs"
                style="display: none"
              ></span>
              <i data-lucide="chevron-right" id="picker-chevron" class="h-3.5 w-3.5"></i>
            </button>
            <div
              id="picker-panel"
              class="mt-3 max-h-48 overflow-y-auto rounded-lg border border-slate-700/50 bg-slate-900/40 p-2"
              style="display: none"
            ></div>
          </div>

          <button
            id="btn-create"
            type="button"
            class="mt-5 inline-flex items-center gap-2 rounded-lg bg-cyan-500 px-5 py-2.5 text-sm font-medium text-slate-900 transition-colors hover:bg-cyan-400 disabled:opacity-50"
          >
            <i data-lucide="sparkles" class="h-4 w-4"></i>
            <span id="create-label">开始智能分析</span>
          </button>
        </div>

        <!-- 历史报告 -->
        <div>
          <h3 class="mb-3 flex items-center gap-2 text-base font-medium text-slate-200">
            <i data-lucide="file-text" class="h-4 w-4 text-cyan-400"></i>
            历史报告
            <span id="report-count" class="text-xs font-normal text-slate-500"></span>
          </h3>
          <div id="report-list" class="space-y-3"></div>
        </div>
      </div>
    </main>

    <div
      id="toast-root"
      class="pointer-events-none fixed bottom-4 right-4 z-[100] flex w-[min(20rem,calc(100vw-2rem))] flex-col gap-2"
    ></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/analysis.js"></script>
  </body>
</html>
